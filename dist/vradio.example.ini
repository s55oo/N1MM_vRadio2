; vRadio 1.0.7 settings. Command-line options override these.
; yes/no for on/off options; leave a value empty for the default.
[vradio]

; --pcs: 1 = one PC (this PC's N1MM runs radio 1 and radio 2), 2 = two PCs (a second PC's N1MM
; is radio 2 over the LAN, TCP 4532; see SETUP_2PC.md). The DJ console stays on this PC.
pcs = 1

; --radio: radio port (default COM14)
radio = COM14

; --radio-baud: radio baud (default 38400)
radio_baud = 38400

; --cat: TS-2000 emulation port (default COM1)
cat = COM1

; --cat-baud: emulation port baud (default 38400)
cat_baud = 38400

; --tcp: serve TS-2000 CAT over TCP on this port instead of a COM port (e.g. 4532)
tcp = 4532

; --tcp-host: TCP listen address (default 127.0.0.1; use 0.0.0.0 for other PCs)
tcp_host = 127.0.0.1

; --usb-data: when software selects USB, put the radio in DATA-U (good for WSJT-X/FT8)
usb_data = no

; --lsb-data: when software selects LSB, use DATA-L
lsb_data = no

; --vfo: radio VFO the software controls as its VFO-A (default B = SUB band)
vfo = B

; --tx-follow: at startup set the radio to transmit on the same VFO as --vfo (no split)
tx_follow = no

; --same-band: at startup copy the other radio VFO onto ours (A->B), so both are on one band
same_band = no

; --follow-band: whenever the other VFO (N1MM radio A) changes band, move our VFO to that band
follow_band = yes

; --auto-split: CAT TX from this software transmits on our VFO (ST1), RX gives TX back to the
; other VFO (ST0)
auto_split = yes
; --split-off-idle: with --auto-split: split on only while radio 2 transmits by CAT TX (N1MM
; PTT via radio command); off after every TX and while idle, whatever the focus
split_off_idle = no

; --n1mm-udp: with --auto-split: follow N1MM TX focus from its RadioInfo UDP broadcast (N1MM
; Configurer > Broadcast Data > Radio, e.g. 12064; avoid 12060-12063, used by
; Callbooker/QSOrouter/POUNCer/PingPong)
n1mm_udp = 12064

; --n1mm-radio: which N1MM radio number vRadio is (default 2)
n1mm_radio = 2

; --dual-rx: keep dual receive (MAIN + SUB) on all the time
dual_rx = yes

; --dual-rx-cmd: radio command for dual receive (default FR00; - verify on site)
dual_rx_cmd = FR00;

; --poll: AI auto-info poll interval, seconds
poll = 0.3

; --verbose: log every command
verbose = no

; --log: also write the log to this file
log = 

; --tray: run as a system tray icon (vRadioTray.exe always does)
tray = no

; --auto-update: at start, install a newer GitHub release (if any) and restart with it
auto_update = yes

; --no-update-check: do not check GitHub for new versions
no_update_check = no
